name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-debug-${{ hashFiles('mattermost.client.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-debug-

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: ./build.sh

      - name: Test & Check Coverage
        run: ./test.sh

      - name: Upload Test Results & Coverage Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  lint:
    name: Lint Migrated Files
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: ./lint.sh

  release-check:
    name: Release Build & Universal Lipo Check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Release build artifacts
        uses: actions/cache@v4
        with:
          path: |
            build/Build/Intermediates.noindex
            build/ModuleCache.noindex
          key: ${{ runner.os }}-xcode-release-${{ hashFiles('mattermost.client.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-release-

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Release DMG (Universal)
        run: ./build_release.sh --adhoc

      - name: Verify Universal Architectures (lipo)
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/mattermost.client.app"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/mattermost.client")"
          echo "Architectures: $ARCHS"
          printf '%s\n' "$ARCHS" | tr ' ' '\n' | grep -qx arm64
          printf '%s\n' "$ARCHS" | tr ' ' '\n' | grep -qx x86_64
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify DMG Artifact
        run: |
          set -euo pipefail
          DMG="$(find build/Build/Products/Release -maxdepth 1 -name 'mattermost.client-*.dmg' | head -1)"
          [ -n "$DMG" ] || { echo "::error::No DMG produced"; exit 1; }
          shasum -a 256 "$DMG" | tee "$DMG.ci.sha256"
          hdiutil verify "$DMG"

      - name: Smoke launch
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/mattermost.client.app/Contents/MacOS/mattermost.client"
          "$APP" >/tmp/mattermost-smoke.log 2>&1 &
          PID=$!
          for _ in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Release app exited during launch"
              cat /tmp/mattermost-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "Release app stayed alive for the smoke window."

      - name: Upload Release DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-client-release-universal
          path: |
            build/Build/Products/Release/mattermost.client-*.dmg
            build/Build/Products/Release/mattermost.client-*.dmg.sha256
          if-no-files-found: error
