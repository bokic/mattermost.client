name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint migrated files
        run: ./lint.sh
